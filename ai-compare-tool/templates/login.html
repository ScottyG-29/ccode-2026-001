<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — AI Response Comparison Tool</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
    input[type="password"] { width: 100%; box-sizing: border-box; font: inherit; padding: 0.5rem; margin-top: 0.5rem; }
    button { padding: 0.5rem 1.5rem; font: inherit; cursor: pointer; margin-top: 1rem; }
    .error { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
