# Fly.io app configuration.
# 'app' must be globally unique across all of Fly — change this before deploying.
app = "your-ai-compare-tool"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
